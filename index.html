<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search for a city and see current modeled weather conditions.">
  <meta name="color-scheme" content="dark">
  <title>City Weather | Weather App</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./weather-app.js"></script>
</head>
<body>
  <main class="layout">
    <section class="card" aria-labelledby="page-title">
      <header>
        <p class="eyebrow">Weather, wherever you are</p>
        <h1 id="page-title">What's the sky doing?</h1>
        <p class="intro">Look up current modeled conditions in a city around the world.</p>
      </header>

      <form class="search" id="weather-search" aria-busy="false">
        <label for="city-input">City or town</label>
        <div class="search-row">
          <input id="city-input" name="city" type="search" inputmode="search"
                 autocomplete="address-level2" placeholder="Try Querétaro, Mexico"
                 minlength="2" maxlength="120" required>
          <button id="search-button" type="submit">See weather</button>
        </div>
        <p class="search-hint">For similar city names, include a state or country.</p>
      </form>

      <p class="message" id="message" role="status" aria-live="polite" hidden></p>

      <section class="weather" id="weather" aria-labelledby="city-name" hidden>
        <div class="weather-main">
          <div>
            <p class="eyebrow">Current conditions</p>
            <h2 id="city-name"></h2>
            <p class="condition" id="condition"></p>
            <p class="observation" id="observation-time"></p>
          </div>
          <span class="weather-icon" id="condition-icon" role="img" aria-label="Weather conditions"></span>
        </div>
        <p class="temperature" id="temperature"></p>
        <div class="details">
          <div class="metric">
            <p class="metric-label">Humidity</p>
            <p class="metric-value" id="humidity"></p>
          </div>
          <div class="metric">
            <p class="metric-label">Wind speed</p>
            <p class="metric-value" id="wind"></p>
          </div>
        </div>
      </section>

      <footer>
        Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>
        · Location data by <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a>
      </footer>
    </section>
  </main>
  <noscript>Enable JavaScript to search for weather conditions.</noscript>
</body>
</html>
